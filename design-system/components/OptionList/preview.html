<!-- @dsCard group="Add activity" height=520 subtitle="Step 2: choose the sub-activity" -->
<div style="padding:16px;max-width:480px">
  <fieldset class="td-options">
    <legend>Select an option for "Travelling"</legend>
    <label class="td-option" data-activity-id="travel.travelling.walking" data-redcap-field="" data-redcap-code=""><input type="radio" name="opt" value="walking"> Travelling: walking</label>
    <label class="td-option" data-activity-id="travel.travelling.cycle" data-redcap-field="" data-redcap-code=""><input type="radio" name="opt" value="cycle" checked> Travelling: cycle</label>
    <label class="td-option" data-activity-id="travel.travelling.running" data-redcap-field="" data-redcap-code=""><input type="radio" name="opt" value="running"> Travelling: running</label>
    <label class="td-option" data-activity-id="travel.travelling.private-vehicle" data-redcap-field="" data-redcap-code=""><input type="radio" name="opt" value="vehicle"> Travelling: car, motorbike, moped, E-scooter, taxi or similar</label>
    <label class="td-option" data-activity-id="travel.travelling.public-transport" data-redcap-field="" data-redcap-code=""><input type="radio" name="opt" value="public"> Travelling: public transport</label>
    <label class="td-option" data-activity-id="travel.travelling.other" data-redcap-field="" data-redcap-code=""><input type="radio" name="opt" value="other"> Travelling: other</label>
  </fieldset>
</div>
