<!-- @dsCard group="Add activity" height=280 width=390 subtitle="Repeat this activity on other days. Plain checkboxes, no script." -->
<div style="width:390px;max-width:100%;padding:16px">
  <fieldset class="td-days" aria-describedby="days-hint">
    <legend>Also on other days?</legend>
    <p class="td-hint" id="days-hint">Same activity and time. Tap the days that were the same.</p>
    <div class="td-days__grid">
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-19" aria-label="Mon 19 Oct"><span class="td-day-chip__wd" aria-hidden="true">Mon</span><span class="td-day-chip__d" aria-hidden="true">19</span></label>
      <label class="td-day-chip td-day-chip--current"><input type="checkbox" name="days" value="2026-10-20" checked aria-label="Tue 20 Oct, this activity"><span class="td-day-chip__wd" aria-hidden="true">Tue</span><span class="td-day-chip__d" aria-hidden="true">20</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-21" checked aria-label="Wed 21 Oct"><span class="td-day-chip__wd" aria-hidden="true">Wed</span><span class="td-day-chip__d" aria-hidden="true">21</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-22" checked aria-label="Thu 22 Oct"><span class="td-day-chip__wd" aria-hidden="true">Thu</span><span class="td-day-chip__d" aria-hidden="true">22</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-23" aria-label="Fri 23 Oct"><span class="td-day-chip__wd" aria-hidden="true">Fri</span><span class="td-day-chip__d" aria-hidden="true">23</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-24" aria-label="Sat 24 Oct"><span class="td-day-chip__wd" aria-hidden="true">Sat</span><span class="td-day-chip__d" aria-hidden="true">24</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-25" aria-label="Sun 25 Oct"><span class="td-day-chip__wd" aria-hidden="true">Sun</span><span class="td-day-chip__d" aria-hidden="true">25</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-26" aria-label="Mon 26 Oct"><span class="td-day-chip__wd" aria-hidden="true">Mon</span><span class="td-day-chip__d" aria-hidden="true">26</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-27" aria-label="Tue 27 Oct"><span class="td-day-chip__wd" aria-hidden="true">Tue</span><span class="td-day-chip__d" aria-hidden="true">27</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-28" aria-label="Wed 28 Oct"><span class="td-day-chip__wd" aria-hidden="true">Wed</span><span class="td-day-chip__d" aria-hidden="true">28</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-29" aria-label="Thu 29 Oct"><span class="td-day-chip__wd" aria-hidden="true">Thu</span><span class="td-day-chip__d" aria-hidden="true">29</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-30" aria-label="Fri 30 Oct"><span class="td-day-chip__wd" aria-hidden="true">Fri</span><span class="td-day-chip__d" aria-hidden="true">30</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-10-31" aria-label="Sat 31 Oct"><span class="td-day-chip__wd" aria-hidden="true">Sat</span><span class="td-day-chip__d" aria-hidden="true">31</span></label>
      <label class="td-day-chip"><input type="checkbox" name="days" value="2026-11-01" aria-label="Sun 1 Nov"><span class="td-day-chip__wd" aria-hidden="true">Sun</span><span class="td-day-chip__d" aria-hidden="true">1</span></label>
    </div>
  </fieldset>
</div>
