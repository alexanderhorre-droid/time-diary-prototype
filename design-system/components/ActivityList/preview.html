<!-- @dsCard group="Add activity" height=760 subtitle="Step 1: flat list, recents first, no accordions" -->
<div style="padding:16px;max-width:480px">
  <div class="td-activity-list">
    <section class="td-activity-group" aria-labelledby="g-recent">
      <h3 id="g-recent">Used recently</h3>
      <ul>
        <li><button class="td-activity" type="button" data-activity-id="travel.travelling.cycle" data-redcap-field="" data-redcap-code="">
          <span class="td-pat td-pat--travel" aria-hidden="true"></span>
          <span class="td-activity__body"><span class="td-activity__title">Travelling: cycle</span><span class="td-activity__hint">Goes straight to the time</span></span>
        </button></li>
        <li><button class="td-activity" type="button" data-activity-id="general.sleeping" data-redcap-field="" data-redcap-code="">
          <span class="td-pat td-pat--general" aria-hidden="true"></span>
          <span class="td-activity__body"><span class="td-activity__title">Sleeping</span></span>
        </button></li>
      </ul>
    </section>
    <section class="td-activity-group" aria-labelledby="g-general">
      <h3 id="g-general">General Activities</h3>
      <ul>
        <li><button class="td-activity" type="button" data-activity-id="general.sleeping" data-redcap-field="" data-redcap-code="">
          <span class="td-pat td-pat--general" aria-hidden="true"></span>
          <span class="td-activity__body"><span class="td-activity__title">Sleeping</span></span>
        </button></li>
        <li><button class="td-activity" type="button" data-activity-id="general.adl" data-redcap-field="" data-redcap-code="">
          <span class="td-pat td-pat--general" aria-hidden="true"></span>
          <span class="td-activity__body"><span class="td-activity__title">Activities of Daily Living</span><span class="td-activity__hint">Eating, drinking, personal care, household routines, caring for children, pets, …</span></span>
          <span class="td-activity__end"><svg class="td-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
        </button></li>
        <li><button class="td-activity" type="button" data-activity-id="general.resting" data-redcap-field="" data-redcap-code="">
          <span class="td-pat td-pat--general" aria-hidden="true"></span>
          <span class="td-activity__body"><span class="td-activity__title">Resting</span><span class="td-activity__hint">Lunch break, couch time, downtime, …</span></span>
          <span class="td-activity__end"><svg class="td-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
        </button></li>
      </ul>
    </section>
    <section class="td-activity-group" aria-labelledby="g-travel">
      <h3 id="g-travel">Travel &amp; Transit</h3>
      <ul>
        <li><button class="td-activity" type="button" data-activity-id="travel.travelling" data-redcap-field="" data-redcap-code="">
          <span class="td-pat td-pat--travel" aria-hidden="true"></span>
          <span class="td-activity__body"><span class="td-activity__title">Travelling</span><span class="td-activity__hint">Walking, cycle, running, car, public transport, …</span></span>
          <span class="td-activity__end"><svg class="td-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
        </button></li>
      </ul>
    </section>
    <section class="td-activity-group" aria-labelledby="g-other">
      <h3 id="g-other">Other</h3>
      <ul>
        <li><button class="td-activity" type="button" data-activity-id="other.other" data-redcap-field="" data-redcap-code="">
          <span class="td-pat td-pat--other" aria-hidden="true"></span>
          <span class="td-activity__body"><span class="td-activity__title">Other Activity</span><span class="td-activity__hint">Please specify.</span></span>
          <span class="td-activity__end"><svg class="td-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></span>
        </button></li>
        <li><button class="td-activity" type="button" data-activity-id="other.forgot" data-redcap-field="" data-redcap-code="">
          <span class="td-pat td-pat--other" aria-hidden="true"></span>
          <span class="td-activity__body"><span class="td-activity__title">Forgot / Unspecified</span></span>
        </button></li>
      </ul>
    </section>
  </div>
</div>
