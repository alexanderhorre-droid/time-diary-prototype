<!-- @dsCard height=288 -->
<div class="cv">
  <style>
    .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
    .cv-art { position: absolute; top: 0; left: 480px; display: block; }
    .cv-art .ink { fill: var(--ink); }
    .cv-art .s2 { fill: var(--surface-200); }
    .cv-art .mu { fill: var(--ink-muted); }
    .cv-art .bg { fill: var(--bg); }
    .cv-art .r { rx: var(--radius-sm); }
    .cv-art .edge { fill: none; stroke: var(--ink); stroke-width: 1.5px; }
    .cv-art .rule { stroke: var(--line); stroke-width: 1px; }
    .cv-text { position: absolute; left: 40px; bottom: 32px; max-width: 400px; }
    .cv-text h1 { margin: 0; font-size: 104px; line-height: 0.95; font-weight: 700; letter-spacing: -0.03em; }
    .cv-text p { margin: 16px 0 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
  </style>
  <svg class="cv-art" viewBox="480 0 480 288" width="480" height="288" aria-hidden="true">
    <!--
      blocks: ink 136x224 (sleep slab, bleeds off top) · surface-200 136x96 · ink-muted 136x64 · stripes (travel pattern) 152x128, bleeding off the right edge
      arrangement: timeline events in three lanes, tops and heights on the 16px quarter-hour step, gaps space-4
      pattern: hour rules — the system is a timeline; five hairlines at hour-row (64px) pitch, in --line, under the blocks
      scales: quarter 16px, hour-row 64px, space-4 16px gaps, radius-sm 4px corners, 1.5px ink edge as on category swatches
    -->
    <defs>
      <pattern id="cv-stripe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect class="ink" width="2" height="6"/>
      </pattern>
    </defs>
    <line class="rule" x1="480" y1="32"  x2="960" y2="32"/>
    <line class="rule" x1="480" y1="96"  x2="960" y2="96"/>
    <line class="rule" x1="480" y1="160" x2="960" y2="160"/>
    <line class="rule" x1="480" y1="224" x2="960" y2="224"/>
    <line class="rule" x1="480" y1="288" x2="960" y2="288"/>

    <rect class="ink r" x="520" y="-16" width="136" height="224"/>
    <rect class="s2 r"  x="672" y="48"  width="136" height="96"/>
    <rect class="mu r"  x="672" y="160" width="136" height="64"/>
    <rect class="bg r"  x="824" y="96"  width="152" height="128"/>
    <rect class="r" fill="url(#cv-stripe)" x="824" y="96" width="152" height="128"/>
    <rect class="edge r" x="824.75" y="96.75" width="150.5" height="126.5"/>
  </svg>
  <div class="cv-text">
    <h1>Time<br>Diary</h1>
    <p>A calm, monochrome diary for filling in days on a timeline.</p>
  </div>
</div>
